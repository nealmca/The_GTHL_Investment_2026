name: Update prices
on:
  schedule:
    - cron: "*/20 13-21 * * 1-5"   # every 20 min, weekdays, roughly TSX hours (UTC)
    - cron: "0 22 * * 1-5"         # one closing update
  workflow_dispatch: {}            # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fetch_prices.py
      - name: Commit if changed
        run: |
          git config user.name "price-bot"
          git config user.email "price-bot@users.noreply.github.com"
          git add prices.json
          git diff --staged --quiet || (git commit -m "Update prices" && git push)
